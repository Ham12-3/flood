[project]
name = "floodscope-api"
version = "0.1.0"
description = "FloodScope 3D backend: point flood data, raster reads and (later) ML."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "diskcache>=5.6.3",
    "fastapi>=0.158.1",
    "floodscope-ml",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyproj>=3.8.0",
    "rasterio>=1.5.2",
    "shapely>=2.2.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.uv.sources]
floodscope-ml = { path = "../ml", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"floodscope/explain.py" = ["E501"]  # the system prompt is prose

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rasterio.*", "diskcache.*", "pyarrow.*", "shapely.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: hits real external APIs (run with -m live)"]
addopts = "-m 'not live'"
