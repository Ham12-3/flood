[project]
name = "floodscope-ml"
version = "0.1.0"
description = "FloodScope 3D: discharge forecast LSTM (NeuralHydrology on Caravan) and satellite flood mapping."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "onnxruntime>=1.20",
]

[project.optional-dependencies]
# Training and export (run in Google Colab with a GPU).
train = [
    "neuralhydrology>=1.13",
    "torch>=2.4",
    "onnx>=1.17",
    "xarray>=2024.1",
    "netCDF4>=1.7",
    "pyyaml>=6.0",
]
# Satellite flood mapping with IBM/NASA Prithvi (Sen1Floods11).
satellite = [
    "terratorch==0.99.8",
    "torch>=2.4",
    "rasterio>=1.4",
    "httpx>=0.27",
    "huggingface_hub>=0.25",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["floodscope_ml"]

[tool.ruff]
extend-exclude = ["notebooks"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["train: needs torch + neuralhydrology (pip install -e .[train])"]
